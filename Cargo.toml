[workspace]
members = ["crates/gfa-core", "crates/gfa-wasm"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/Vikmanou/GRAPE"

[workspace.dependencies]
gfa-core = { path = "crates/gfa-core" }
# Must match the installed wasm-bindgen-cli version exactly.
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
