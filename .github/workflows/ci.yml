name: CI

# No branch filter on push: every branch is checked, so a broken branch is
# visible before it becomes a pull request.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is what CI and GitHub Pages run on; Windows is the main
        # development machine, and clippy and path handling differ there.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter grape-web exec playwright install --with-deps chromium

      # The same gate contributors run locally.
      - run: pnpm check

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: web/playwright-report
          retention-days: 7
